# System-wide ALSA config for the RaspiAudio HiFiBerry DAC HAT. Installed to
# /etc/asound.conf by remote-setup.sh's configure_audio_hat() when
# PI_RADIO_AUDIO_HAT is set (see deploy/.env.example).
#
# The HAT (snd_rpi_hifiberry_dac / card name "sndrpihifiberry") is a pure
# I2S DAC with no hardware mixer (`amixer -c sndrpihifiberry scontrols`
# returns nothing), so this wraps it in ALSA's "softvol" plugin to get a
# software mixer control named "Master" - matching AudioAdapter.ts's
# hardcoded `amixer set Master ${vol}%`, so no app code change is needed.
# Pinned by card NAME, not index, since card order can shift once onboard
# audio is disabled (see configure_audio_hat).
pcm.!default {
    type softvol
    slave.pcm "hw:sndrpihifiberry"
    control {
        name "Master"
        card "sndrpihifiberry"
    }
}

ctl.!default {
    type hw
    card "sndrpihifiberry"
}

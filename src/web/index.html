<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Kitchen Radio</title>
        <link rel="stylesheet" href="/public/css/style.css">
    </head>
    <body>
        <div id="app">
            <header class="topbar">
                <h1>Kitchen Radio</h1>
                <button id="power_btn" class="icon-btn" aria-label="Toggle power" title="Toggle power">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 2v10"/>
                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                    </svg>
                </button>
            </header>

            <main id="idle_view" class="idle-view">
                <button id="idle_power_btn" class="icon-btn" aria-label="Turn on" title="Turn on">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 2v10"/>
                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                    </svg>
                </button>
                <p>Powered off</p>
            </main>

            <main id="power_view" class="power-view hidden">
                <div class="card">
                    <div class="now-playing__label">Now Playing</div>
                    <div class="now-playing__primary" id="now_playing_primary">&mdash;</div>
                    <div class="now-playing__secondary" id="now_playing_secondary"></div>
                </div>

                <nav class="segmented" role="tablist">
                    <button class="segmented__btn" id="mode_btn_iradio" role="tab">Internet Radio</button>
                    <button class="segmented__btn" id="mode_btn_bt" role="tab">Bluetooth</button>
                </nav>

                <section id="mode_iradio" class="mode-panel">
                    <div class="preset-grid" id="preset_grid"></div>
                    <button id="edit_presets_toggle" class="link-btn">Edit stations</button>
                    <div id="preset_editor" class="preset-editor hidden card"></div>
                </section>

                <section id="mode_bt" class="mode-panel hidden">
                    <div class="card bt-status">
                        <span class="status-dot" id="bt_status_dot"></span>
                        <span id="bt_status_text">Not Paired</span>
                    </div>
                </section>

                <div class="card volume">
                    <span class="volume__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                        </svg>
                    </span>
                    <input type="range" min="0" max="100" value="50" id="volume_slider">
                    <span class="volume__value" id="volume_value">50%</span>
                </div>
            </main>
        </div>

        <div id="toast" class="toast hidden"></div>

        <script src="/public/js/api.js"></script>
        <script src="/public/js/ui.js"></script>
    </body>
</html>
